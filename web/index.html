<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xander Performance</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --surface-2: #efeee9; --line: #dfddd5;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #85837c;
  --accent: #1d4fa8; --accent-ink: #ffffff;
  --tiktok: #2a78d6; --instagram: #eb6834; --youtube: #1baf7a;
  --good: #1b7a3d; --good-bg: #e2f2e6; --warn: #8a5a00; --warn-bg: #fbefd2; --bad: #b3261e; --bad-bg: #fbe4e2;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --surface-2: #242422; --line: #33322f;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8d8b83;
    --accent: #7fa8ee; --accent-ink: #0b0b0b;
    --tiktok: #3987e5; --instagram: #d95926; --youtube: #199e70;
    --good: #6fd08c; --good-bg: #173322; --warn: #e6b34a; --warn-bg: #3a2e12; --bad: #f08a83; --bad-bg: #3d1c1a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brandmark { padding: 18px 16px 12px; }
.brandmark b { display: block; font-size: 15px; letter-spacing: .02em; }
.brandmark span { color: var(--text-3); font-size: 12px; }
.side input[type=search] { margin: 0 12px 8px; }
.brandlist { overflow: auto; flex: 1; padding: 0 8px 8px; }
.brandlist button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 6px; }
.brandlist button:hover { background: var(--surface-2); }
.brandlist button[aria-current=true] { background: var(--text); color: var(--surface); }
.brandlist button small { color: var(--text-3); font-variant-numeric: tabular-nums; }
.brandlist button[aria-current=true] small { color: inherit; opacity: .7; }
.brandlist .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brandlist .archived-toggle { margin-top: 10px; border-top: 1px solid var(--line); border-radius: 0; padding-top: 10px; color: var(--text-2); font-weight: 600; }
.brandlist .archived-list button:not([aria-current=true]) { color: var(--text-2); }
.badge.arch { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line); vertical-align: middle; margin-left: 8px; font-size: 12px; }
.sidefoot { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 6px; }
.main { padding: 20px 24px 48px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; justify-content: space-between; }
h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 7px; white-space: nowrap; }
.btn:hover { border-color: var(--text-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { border-color: transparent; background: none; padding: 4px 6px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; min-width: 0; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--text-3); }
.chip[aria-pressed=true] { background: var(--text); color: var(--surface); border-color: var(--text); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile .lab { color: var(--text-2); font-size: 12px; }
.tile .val { font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .note { color: var(--text-3); font-size: 12px; min-height: 17px; }
.tile.hero { border-color: var(--text); }
.src { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.src-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.src-head a { color: var(--accent); font-size: 12px; }
.src-stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
.src-stats b { color: var(--text); }
.src-brands { display: flex; flex-wrap: wrap; gap: 6px; max-height: 120px; overflow: auto; }
.src-brands .chip { font-size: 12px; padding: 3px 9px; }
dialog:has(.src) { width: min(760px, calc(100vw - 32px)); }
.kpi .body { padding-top: 10px; }
.kpi-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px 28px; }
.kpi-grid dl { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
.kpi-grid dt { color: var(--text-2); font-size: 12px; }
.kpi-grid dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.kpi-grid dd a { color: var(--accent); }
.kpi-progress { display: grid; gap: 14px; align-content: start; }
.krow .kl { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.krow .kl span { color: var(--text-2); }
.kbar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 6px 0 4px; }
.kbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.kbar i.done { background: var(--good); }
@media (max-width: 860px) { .kpi-grid { grid-template-columns: minmax(0, 1fr); } .kpi-grid dl { grid-template-columns: minmax(0, 1fr); } }
.delta { font-size: 12px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.delta.flat { color: var(--text-3); }
td .delta { display: inline; font-size: 11.5px; margin-left: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; }
.card > header { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding: 12px 14px 0; }
.card h2 { font-size: 15px; margin: 0; }
.card .body { padding: 12px 14px 14px; }
.legend { display: flex; gap: 14px; color: var(--text-2); font-size: 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.chartwrap { position: relative; }
svg text { fill: var(--text-3); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 170px; z-index: 5; display: none; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; justify-content: space-between; gap: 14px; }
.tip div span:first-child { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--text-2); font-weight: 600; font-size: 12px; border-top: 0; user-select: none; }
th[data-sort] { cursor: pointer; }
th[data-sort]:hover { color: var(--text); }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
tbody tr:hover { background: var(--surface-2); }
td.title { max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
td.title a { color: inherit; text-decoration: none; }
td.title a:hover { text-decoration: underline; }
tr.clickable { cursor: pointer; }
.badge { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; }
.badge.good { background: var(--good-bg); color: var(--good); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.mute { background: var(--surface-2); color: var(--text-2); }
.pager { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: var(--text-2); font-size: 12.5px; gap: 8px; flex-wrap: wrap; }
.empty { padding: 28px; text-align: center; color: var(--text-2); }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { padding: 18px; display: grid; gap: 12px; }
dialog h3 { margin: 0; font-size: 17px; }
dialog label { display: grid; gap: 4px; font-size: 12.5px; color: var(--text-2); }
dialog .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
dialog .foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
dialog .hint { font-size: 12.5px; color: var(--text-2); }
textarea { min-height: 150px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
.exports { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.btn.export { text-align: left; white-space: normal; display: grid; gap: 2px; padding: 10px 12px; }
.btn.export span { color: var(--text-2); font-size: 12px; }
.tv { height: 100vh; overflow: hidden; display: grid; grid-template-rows: auto auto 1fr auto; gap: 1.6vh; padding: 2.4vh 2.2vw; cursor: none; }
.tv.pointer { cursor: default; }
.tv-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 2vw; }
.tv-head h1 { font-size: 4.2vh; letter-spacing: -.02em; }
.tv-head .sub { font-size: 1.9vh; margin-top: .4vh; }
.tv-clock { text-align: right; font-variant-numeric: tabular-nums; }
.tv-clock b { display: block; font-size: 4.2vh; font-weight: 650; }
.tv-clock span { color: var(--text-2); font-size: 1.8vh; }
.tv-kpis { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 1vw; }
.tv-kpis .tile { padding: 1.4vh 1vw; border-radius: 1.2vh; }
.tv-kpis .lab { font-size: 1.7vh; }
.tv-kpis .val { font-size: 4.4vh; }
.tv-kpis .note { font-size: 1.5vh; min-height: 0; }
.tv-kpis .delta { font-size: 1.6vh; margin-top: .3vh; }
.tv-body { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 1.2vw; min-height: 0; }
.tv-body .card { margin: 0; display: flex; flex-direction: column; min-height: 0; }
.tv-body .card > header h2 { font-size: 2.2vh; }
.tv-body .legend { font-size: 1.6vh; }
.tv-body #chart { flex: 1; min-height: 0; margin: 1vh 1vw 1.4vh; }
.tv-side { display: flex; flex-direction: column; gap: 1.2vw; min-height: 0; }
.tv-side > .card:last-child { flex: 1; }
.tv-kpi { padding-bottom: 1.2vh; }
.tv-kpi > header .sub { font-size: 1.6vh; }
.tv-kpi-when { padding: .4vh 1vw 0; color: var(--text-2); font-size: 1.7vh; }
.tv-krow { padding: 1vh 1vw 0; }
.tv-krow .kl { display: flex; justify-content: space-between; gap: 1vw; font-size: 1.8vh; }
.tv-krow .kl span { color: var(--text-2); }
.tv-krow .kl b { font-variant-numeric: tabular-nums; }
.tv-krow .kbar { height: 1vh; min-height: 6px; margin: .6vh 0 0; }
.tv-list .kok { color: var(--good); }
.tv-list { list-style: none; margin: 0; padding: .6vh 1vw 1vh; display: grid; gap: .2vh; overflow: hidden; }
.tv-list li { display: grid; grid-template-columns: 3.4vh minmax(0, 1fr) auto; align-items: center; gap: .8vw; padding: .75vh 0; border-top: 1px solid var(--line); font-size: 2vh; }
.tv-list li:first-child { border-top: 0; }
.tv-list .rank { color: var(--text-3); font-variant-numeric: tabular-nums; }
.tv-list .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tv-list .name small { display: block; color: var(--text-2); font-size: 1.5vh; }
.tv-list .v { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.tv-list .v small { display: block; color: var(--text-2); font-weight: 400; font-size: 1.5vh; }
.tv-foot { display: flex; justify-content: space-between; align-items: center; color: var(--text-3); font-size: 1.6vh; }
.tv-next { display: flex; align-items: center; gap: 1vw; }
.tv-next .count { font-variant-numeric: tabular-nums; color: var(--text-2); }
.tv-next .count b { color: var(--text); font-weight: 650; font-size: 2.2vh; }
.tv-progress { height: .7vh; min-height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; width: 22vw; }
.tv-progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transform-origin: left center; transform: scaleX(0); will-change: transform; }
.tv-exit { position: fixed; top: 1.2vh; right: 1vw; opacity: 0; transition: opacity .2s; }
.tv.pointer .tv-exit { opacity: 1; }
.tv svg text { font-size: 1.5vh; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow); z-index: 50; max-width: calc(100vw - 32px); }
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login form { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; width: min(360px, 100%); display: grid; gap: 12px; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; font-size: 13px; }
.mobilebrand { display: none; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .mobilebrand { display: block; width: 100%; margin-bottom: 12px; }
  .main { padding: 16px 16px 40px; }
}
</style>
</head>
<body>
<div id="root"></div>
<div id="dialogs"></div>
<script src="config.js"></script>
<script src="demo-data.js"></script>
<script src="urls.js"></script>
<script src="sheet.js"></script>
<script>
'use strict';
const CFG = window.XANDER_CONFIG || {};
const LIVE = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
const PLAT = { tiktok: 'TikTok', instagram: 'Instagram', youtube: 'YouTube' };
const METRICS = ['views', 'likes', 'comments', 'shares', 'saves'];
const nf = new Intl.NumberFormat('en-US');
const cf = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 });
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (n === null || n === undefined ? '–' : nf.format(n));
const pct = (x) => (x === null ? '–' : (x * 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%');
const WIB = 7 * 3600000;
const dayKey = (iso) => (iso ? new Date(Date.parse(iso) + WIB).toISOString().slice(0, 10) : null);
const todayKey = () => dayKey(new Date().toISOString());
const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const monthLabel = (ym) => `${MONTH_NAMES[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const dateLabel = (key) => (key ? `${MONTH_NAMES[+key.slice(5, 7) - 1]} ${+key.slice(8, 10)}, ${key.slice(0, 4)}` : '–');
function ago(iso) {
  if (!iso) return '';
  const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
  if (m < 60) return m < 1 ? 'just now' : `${m} min ago`;
  if (m < 48 * 60) return `${Math.round(m / 60)} h ago`;
  return `${Math.round(m / 1440)} days ago`;
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  // Di dalam jendela yang sedang terbuka (bila ada), supaya tidak tertutup oleh jendela itu.
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; (document.querySelector('dialog[open]') || document.body).append(t);
  setTimeout(() => t.remove(), 4500);
}

// ---------------------------------------------------------------- data layer
const DB = {
  sb: null,
  async init() {
    if (!LIVE) return;
    await new Promise((ok, fail) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
      s.onload = ok; s.onerror = () => fail(new Error('Could not load the Supabase library')); document.head.append(s);
    });
    this.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  },
  ok({ data, error }) { if (error) throw new Error(error.message); return data; },
  async all(table) {
    const out = [];
    for (let from = 0; ; from += 1000) {
      const page = this.ok(await this.sb.from(table).select('*').order('id').range(from, from + 999));
      out.push(...page);
      if (page.length < 1000) return out;
    }
  },
  async load() {
    if (!LIVE) {
      const d = window.DEMO_DATA || { brands: [], contents: [], settings: {} };
      return { brands: d.brands, contents: d.contents, settings: d.settings || {} };
    }
    const [brands, all, rows] = await Promise.all([this.all('brands'), this.all('contents'), this.sb.from('settings').select('*').then((r) => this.ok(r))]);
    // Link yang sudah dihapus dari macrosheets tidak ditampilkan.
    const contents = all.filter((c) => !c.removed_at);
    return { brands, contents, removedCount: all.length - contents.length, settings: Object.fromEntries(rows.map((r) => [r.key, r.value])) };
  },
  async addBrand(row) {
    if (!LIVE) { const b = { id: crypto.randomUUID(), ...row }; S.brands.push(b); return b; }
    const b = this.ok(await this.sb.from('brands').insert(row).select().single()); S.brands.push(b); return b;
  },
  async updateBrand(id, patch) {
    if (LIVE) this.ok(await this.sb.from('brands').update(patch).eq('id', id));
    const b = S.brands.find((x) => x.id === id);
    Object.assign(b, patch);
    b.archived = b.archived_override ?? !!b.sheet_hidden;
  },
  async deleteBrand(id) {
    if (LIVE) this.ok(await this.sb.from('brands').delete().eq('id', id));
    S.brands = S.brands.filter((b) => b.id !== id); S.contents = S.contents.filter((c) => c.brand_id !== id);
  },
  async addContents(rows) {
    if (!LIVE) {
      for (const r of rows) S.contents.push({ id: crypto.randomUUID(), aliases: [], title: null, posted_at: null, views: null, likes: null, comments: null, shares: null, saves: null, source: 'none', status: 'pending', fail_count: 0, created_at: new Date().toISOString(), ...r });
      return;
    }
    const data = this.ok(await this.sb.from('contents').upsert(rows, { onConflict: 'brand_id,platform,external_id', ignoreDuplicates: true }).select());
    S.contents.push(...data);
  },
  async updateContent(id, patch) {
    if (LIVE) this.ok(await this.sb.from('contents').update(patch).eq('id', id));
    Object.assign(S.contents.find((c) => c.id === id), patch);
  },
  async deleteContent(id) {
    if (LIVE) this.ok(await this.sb.from('contents').delete().eq('id', id));
    S.contents = S.contents.filter((c) => c.id !== id);
  },
  async fn(body) {
    const { data } = await this.sb.auth.getSession();
    return fetch(`${CFG.supabaseUrl}/functions/v1/collect`, {
      method: 'POST', body: JSON.stringify(body),
      headers: { 'Content-Type': 'application/json', apikey: CFG.supabaseAnonKey, Authorization: `Bearer ${data.session?.access_token || CFG.supabaseAnonKey}` },
    });
  },
  // Sedikit konten: ambil sekarang dan tunggu hasilnya. Banyak: tandai, diproses bertahap di latar belakang.
  async requestRefresh(ids) {
    if (!LIVE) return 'demo';
    if (ids.length <= 30) {
      const res = await this.fn({ action: 'run', ids });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
      const out = await res.json();
      const rows = this.ok(await this.sb.from('contents').select('*').in('id', ids));
      const got = new Map(rows.map((r) => [r.id, r])), set = new Set(ids);
      S.contents = S.contents.filter((c) => !set.has(c.id) || got.has(c.id)).map((c) => got.get(c.id) || c);

function pref(k, d) { try { const v = localStorage.getItem('xd.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } }

function brandKpi(b) {

const contractRange = (k) => (k?.periods?.length ? [k.periods.map((x) => x[0]).sort()[0], k.periods.map((x) => x[1]).sort().slice(-1)[0]] : null);

  const month = todayKey().slice(0, 7);
  const byPlat = (list) => Object.fromEntries(Object.keys(PLAT).map((p) => [p, list.filter((c) => c.platform === p).length]));
  const posted = byPlat(inContract), thisMonth = byPlat(mine.filter((c) => dayKey(c.posted_at)?.startsWith(month)));

function tile(label, value, note = '', hero = false, prev) {

// Tanda naik/turun dibanding periode sebelumnya. kind 'pt' = selisih poin persentase (untuk ER).
function delta(cur, prev, kind) {
  if (!CMP || prev === null || prev === undefined || cur === null || cur === undefined) return '';
  const title = `Previous (${CMP.label}): ${kind === 'pt' ? pct(prev) : nf.format(prev)}`;
  if (kind === 'pt') {
    const diff = (cur - prev) * 100;
    if (Math.abs(diff) < 0.005) return `<div class="delta flat" title="${title}">● no change</div>`;
    return `<div class="delta ${diff > 0 ? 'up' : 'down'}" title="${title}">${diff > 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(2)} pt</div>`;
  }
  if (cur === prev) return `<div class="delta flat" title="${title}">● no change</div>`;
  if (!prev) return `<div class="delta up" title="${title}">▲ new</div>`;
  const ch = (cur - prev) / prev;
  return `<div class="delta ${ch > 0 ? 'up' : 'down'}" title="${title}">${ch > 0 ? '▲' : '▼'} ${Math.abs(ch * 100) >= 1000 ? cf.format(Math.abs(ch * 100)) : Math.abs(ch * 100).toFixed(1)}%</div>`;

function shortDelta(cur, prev) {

  const ch = (cur - prev) / prev;
  if (Math.abs(ch) < 0.0005) return '<span class="delta flat">● 0%</span>';
  return `<span class="delta ${ch > 0 ? 'up' : 'down'}" title="Previous: ${nf.format(prev)}">${ch > 0 ? '▲' : '▼'} ${Math.abs(ch * 100) >= 1000 ? cf.format(Math.abs(ch * 100)) : Math.abs(ch * 100).toFixed(1)}%</span>`;
}

function byMonth(list) {
  const map = new Map();
  for (const c of list) {
    const k = dayKey(c.posted_at); if (!k) continue;
    const ym = k.slice(0, 7);
    if (!map.has(ym)) map.set(ym, { ym, items: [], tiktok: 0, instagram: 0, youtube: 0 });
    const m = map.get(ym); m.items.push(c); m[c.platform] += c.views || 0;
  }
  const keys = [...map.keys()].sort();
  if (!keys.length) return [];
  const out = [];
  let [y, m] = keys[0].split('-').map(Number);
  const last = keys[keys.length - 1];
  for (;;) {
    const ym = `${y}-${String(m).padStart(2, '0')}`;
    out.push(map.get(ym) || { ym, items: [], tiktok: 0, instagram: 0, youtube: 0 });
    if (ym === last) break;
    if (++m > 12) { m = 1; y++; }
  }
  return out;
}

function renderChart(list) {
  const el = $('#chart');
  let months = byMonth(list);
  if (!months.length) { el.innerHTML = '<div class="empty">No dated contents for this filter yet.</div>'; return; }
  if (months.length > 36) months = months.slice(-36);
  const W = Math.max(320, el.clientWidth), H = TV.on ? Math.max(200, el.clientHeight) : 240, padL = TV.on ? 68 : 44, padB = 24, padT = 8;
  const plats = Object.keys(PLAT).filter((p) => S.platforms.has(p));
  const max = Math.max(1, ...months.map((m) => plats.reduce((a, p) => a + m[p], 0)));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const plotW = W - padL - 6, plotH = H - padB - padT;
  const slot = plotW / months.length, bw = Math.max(4, Math.min(44, slot - 6));
  const y = (v) => padT + plotH - (v / top) * plotH;
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${padL}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${cf.format(v)}</text>`;
  const every = Math.ceil(months.length / Math.max(1, Math.floor(plotW / 62)));
  months.forEach((m, i) => {
    const x = padL + i * slot + (slot - bw) / 2;
    let acc = 0;
    const segs = plats.filter((p) => m[p] > 0);
    segs.forEach((p, si) => {
      const y0 = y(acc), y1 = y(acc + m[p]); acc += m[p];
      const h = Math.max(1, y0 - y1 - (si < segs.length - 1 ? 2 : 0));
      const yy = y0 - h, r = si === segs.length - 1 ? Math.min(4, h, bw / 2) : 0;
      g += `<path d="M${x},${yy + h}V${yy + r}Q${x},${yy} ${x + r},${yy}H${x + bw - r}Q${x + bw},${yy} ${x + bw},${yy + r}V${yy + h}Z" fill="var(--${p})"/>`;
    });
    if (i % every === 0) g += `<text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle">${MONTH_NAMES[+m.ym.slice(5, 7) - 1]} ${m.ym.slice(2, 4)}</text>`;
    g += `<rect data-i="${i}" x="${padL + i * slot}" y="${padT}" width="${slot}" height="${plotH}" fill="transparent"/>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Views by posting month; details in the table below">${g}</svg><div class="tip"></div>`;
  const tip = $('.tip', el);
  el.querySelectorAll('rect[data-i]').forEach((r) => {
    r.addEventListener('mousemove', (e) => {
      const m = months[+r.dataset.i], s = summarize(m.items);
      tip.innerHTML = `<b>${monthLabel(m.ym)}</b>${plats.map((p) => `<div><span><i class="dot" style="background:var(--${p})"></i>${PLAT[p]}</span><span class="num">${nf.format(m[p])}</span></div>`).join('')}<div><span>Total views</span><b class="num" style="margin:0">${nf.format(s.views)}</b></div><div><span>Contents</span><span class="num">${s.n}</span></div><div><span>≥ Target</span><span class="num">${s.hit}</span></div>`;
      tip.style.display = 'block';
      const box = el.getBoundingClientRect();
      let left = e.clientX - box.left + 14; if (left + tip.offsetWidth > box.width) left = e.clientX - box.left - tip.offsetWidth - 14;
      tip.style.left = Math.max(0, left) + 'px'; tip.style.top = Math.max(0, e.clientY - box.top - 20) + 'px';
    });
    r.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
}
function niceStep(raw) {

  for (let i = 0; i < 60; i++) {
    const res = await fetch(`${CFG.supabaseUrl}/functions/v1/sync-sheet`, { method: 'POST', body: '{}',
      headers: { 'Content-Type': 'application/json', apikey: CFG.supabaseAnonKey, Authorization: `Bearer ${data.session?.access_token}` } });
    const st = await res.json().catch(() => ({}));
    if (!res.ok || st.error) throw new Error(st.error || `HTTP ${res.status}`);
    if (st.skipped) break;
    for (const k of ['added', 'updated', 'removed', 'brands']) total[k] += st[k] || 0;
    total.renamed.push(...(st.renamed || []));
    const msg = `Reading macrosheets ${st.sheet} of ${st.sheets} (${sheetTitle(sheetUrls(S.settings.sheet).map(sheetIdOf)[st.sheet - 1] || '')}): ${st.tabs.join(', ')}`;
    if (onProgress) onProgress(msg, total); else if (!silent) toast(msg);
    if (st.done) done.add(st.sheet);
    if (done.size >= st.sheets) break;
  }
  if (total.added) DB.kick();
  return total;
}

};
const loaded = new Set();
async function needLibs(kind) {
  for (const src of LIBS[kind] || []) if (!loaded.has(src)) { await loadScript(src); loaded.add(src); }
}
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function saveBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);

// Semua angka laporan, mengikuti filter yang sedang aktif (brand, periode, platform, pencarian).
function reportData(list) {
  const brand = S.brandMap.get(S.brandId);
  CMP = comparison();
  const range = CMP ? CMP.cur : periodRange();
  const plats = Object.keys(PLAT).filter((p) => S.platforms.has(p));
  const sum = summarize(list);
  const ps = CMP ? summarize(filtered(CMP.prev)) : null;
  const target = brand ? brand.views_target : null;
  const statRow = (s) => [s.n, s.views, s.likes, s.comments, s.shares, s.saves, s.er, s.hit];
  const contents = sortedContents(list);
  const meta = {
    title: brand ? brand.name : 'All Brands',
    period: range ? `${dateLabel(range[0] === '0000-01-01' ? null : range[0])} – ${dateLabel(range[1] === '9999-12-31' ? null : range[1])}` : 'All time',
    platforms: plats.length === Object.keys(PLAT).length ? 'All platforms' : plats.map((p) => PLAT[p]).join(', '),
    generated: new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }),
    target: brand ? `${targetText(brand)} views per content` : 'Set per brand (FYP Quantity per platform where available)',
    kpi: brand ? kpiMeta(brand) : null,
    scope: brand ? (isArchived(brand) ? 'Archived brand' : 'Active brand') : S.includeArchived ? 'All brands, including archived' : 'Active brands only (archived excluded)',
    search: S.q.trim(),
  };
  const hitLabel = brand ? `Contents with ${targetText(brand)}+ views` : 'Contents hitting views target';
  return {
    meta,
    file: `xander-${slug(meta.title)}-${slug(meta.period === 'All time' ? 'all-time' : range[0] + '-' + range[1])}-${todayKey()}`,
    cmp: CMP ? CMP.label : null,
    kpis: [
      ['Total Views', sum.views, 'int', undefined, ps?.views], ['Contents', sum.n, 'int', undefined, ps?.n], ['Likes', sum.likes, 'int', undefined, ps?.likes], ['Comments', sum.comments, 'int', undefined, ps?.comments],
      ['Shares', sum.shares, 'int', undefined, ps?.shares], ['Saves', sum.saves, 'int', undefined, ps?.saves], ['Engagement Rate', sum.er, 'pct', undefined, ps?.er],
      [hitLabel, sum.hit, 'int', sum.withData ? `${nf.format(sum.hit)} of ${nf.format(sum.withData)} (${pct(sum.hit / sum.withData)})` : '0', ps?.hit],
    ],
    statHead: ['Contents', 'Views', 'Likes', 'Comments', 'Shares', 'Saves', 'ER', 'Hit Target'],
    monthly: byMonth(list).filter((m) => m.items.length).reverse().map((m) => [monthLabel(m.ym), ...statRow(summarize(m.items))]),
    monthlyByPlatform: byMonth(list).slice(-12).map((m) => ({ label: monthLabel(m.ym), ...Object.fromEntries(plats.map((p) => [p, m[p]])) })),
    plats,
    brands: S.brandId === 'all' ? countedBrands().map((b) => [b.name + (isArchived(b) ? ' (archived)' : ''), ...statRow(summarize(list.filter((c) => c.brand_id === b.id)))]).filter((r) => r[1]).sort((a, z) => z[2] - a[2]) : null,
    contentHead: ['Brand', 'Platform', 'Title', 'Link', 'Posted', 'Views', 'Likes', 'Comments', 'Shares', 'Saves', 'ER', 'Source'],
    contents: contents.map((c) => [S.brandMap.get(c.brand_id)?.name || '', PLAT[c.platform], c.title || '', c.url, dayKey(c.posted_at) || '', c.views, c.likes, c.comments, c.shares, c.saves, erOf(c),
      { auto: 'Live', sheet: 'Sheet', manual: 'Manual', none: '' }[c.source] || '']),
    top: [...list].filter((c) => c.views !== null && c.views !== undefined).sort((a, z) => z.views - a.views).slice(0, 10),
  };
}
const fmtCell = (v, kind) => (v === null || v === undefined || v === '' ? '–' : kind === 'pct' ? pct(v) : typeof v === 'number' ? nf.format(v) : String(v));
const statText = (r) => r.map((v, i) => fmtCell(v, i === 7 ? 'int' : i === 6 ? 'pct' : 'int'));
const contentText = (r) => r.map((v, i) => (i === 10 ? fmtCell(v, 'pct') : i >= 5 && i <= 9 ? fmtCell(v) : v || '–'));
const kpiText = (k) => (k[3] !== undefined ? k[3] : fmtCell(k[1], k[2]));
// Perubahan dibanding periode sebelumnya, sebagai teks (mis. "+12.4%", "-0.21 pt").
function changeText(k) {
  const cur = k[1], prev = k[4];
  if (prev === undefined || prev === null || cur === null || cur === undefined) return '–';
  if (k[2] === 'pct') { const d = (cur - prev) * 100; return `${d >= 0 ? '+' : '-'}${Math.abs(d).toFixed(2)} pt`; }
  if (!prev) return cur ? 'new' : '0%';
  const ch = (cur - prev) / prev * 100; return `${ch >= 0 ? '+' : '-'}${Math.abs(ch).toFixed(1)}%`;
}
const kpiHead = (d) => (d.cmp ? ['Metric', 'Value', `Previous (${d.cmp})`, 'Change'] : ['Metric', 'Value']);
const kpiRows = (d) => d.kpis.map((k) => (d.cmp ? [k[0], kpiText(k), fmtCell(k[4], k[2]), changeText(k)] : [k[0], kpiText(k)]));
const metaLines = (d) => [...(d.meta.kpi || []), ['Brands', d.meta.scope], ['Period (posting date)', d.meta.period], ...(d.cmp ? [['Compared with', d.cmp]] : []), ['Platforms', d.meta.platforms], ['Views target', d.meta.target], ...(d.meta.search ? [['Search filter', d.meta.search]] : []), ['Generated', d.meta.generated]];

function kpiMeta(b) {
  const st = kpiStats(b);
  if (!st) return [];
  const f = st.k.fields || {}, out = [];
  if (f.contract) out.push(['Contract', f.contract]);
  if (st.k.periods?.length) out.push(['Contract period', st.k.periods.map(([a, z]) => `${dateLabel(a)} – ${dateLabel(z)}`).join(', ')]);
  else if (f.period) out.push(['Contract period', f.period]);
  if (st.k.total_videos) out.push(['Videos posted in contract', `${st.postedMax} of ${st.k.total_videos}`]);
  if (st.k.quantity_per_month) out.push(['Posted this month', `${st.monthMax} of ${st.k.quantity_per_month}`]);
  for (const x of st.fyp) out.push([`KPI FYP ${PLAT[x.p]} (>= ${nf.format(x.fyp)} views)`, `${x.hits} of ${x.target}${x.hits >= x.target ? ' - achieved' : ''}`]);
  for (const v of st.views) out.push([`KPI Views ${v.label} (total in contract)`, `${nf.format(v.value)} of ${nf.format(v.target)}${v.value >= v.target ? ' - achieved' : ''}`]);
  return out;
}
// ---- Excel
async function exportXlsx(d) {
  await needLibs('xlsx');
  const X = window.XLSX, wb = X.utils.book_new();
  const sheet = (rows, widths, pctCols = []) => {
    const ws = X.utils.aoa_to_sheet(rows);
    ws['!cols'] = widths.map((w) => ({ wch: w }));
    const r = X.utils.decode_range(ws['!ref']);
    for (let R = r.s.r; R <= r.e.r; R++) for (let C = r.s.c; C <= r.e.c; C++) {
      const cell = ws[X.utils.encode_cell({ r: R, c: C })];
      if (cell && cell.t === 'n') cell.z = pctCols.includes(C) ? '0.00%' : '#,##0';
    }
    return ws;
  };
  const summary = [[`Content Performance Report — ${d.meta.title}`], ['Xander Creative Agency'], [], ...metaLines(d), [], kpiHead(d),
    ...d.kpis.map((k) => (d.cmp ? [k[0], k[1], k[4] ?? '', changeText(k)] : [k[0], k[1]])), ...(d.kpis[7][3] ? [['Hit rate', d.kpis[7][3]]] : [])];
  const ws1 = sheet(summary, [34, 40, 26, 12]);
  const erRow = summary.findIndex((r) => r[0] === 'Engagement Rate');
  for (const c of [1, 2]) if (erRow >= 0 && ws1[X.utils.encode_cell({ r: erRow, c })]) ws1[X.utils.encode_cell({ r: erRow, c })].z = '0.00%';
  X.utils.book_append_sheet(wb, ws1, 'Summary');
  X.utils.book_append_sheet(wb, sheet([['Posting Month', ...d.statHead], ...d.monthly], [16, 10, 14, 12, 12, 12, 12, 9, 11], [7]), 'Monthly');
  if (d.brands) X.utils.book_append_sheet(wb, sheet([['Brand', ...d.statHead], ...d.brands], [28, 10, 14, 12, 12, 12, 12, 9, 11], [7]), 'Brands');
  X.utils.book_append_sheet(wb, sheet([d.contentHead, ...d.contents], [22, 10, 50, 50, 12, 12, 10, 10, 10, 10, 9, 8], [10]), 'Contents');
  X.writeFile(wb, d.file + '.xlsx');
}

  const W = doc.internal.pageSize.getWidth(), M = 36;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text(clean(`Content Performance Report - ${d.meta.title}`), M, 48);
  doc.setFont('helvetica', 'normal');

  const opts = { margin: { left: M, right: M }, styles: { fontSize: 8, cellPadding: 4 }, headStyles: { fillColor: [29, 79, 168] }, theme: 'striped' };
  doc.autoTable({ margin: { left: M, right: M }, startY: 58, theme: 'plain', body: metaLines(d).map(([k, v]) => [clean(k), clean(v)]),

  const numRight = (from) => Object.fromEntries(Array.from({ length: 12 }, (_, i) => [i + from, { halign: 'right' }]));
  doc.autoTable({ ...opts, startY: heading('Performance by Posting Month', next()), head: [['Posting Month', ...d.statHead]], body: d.monthly.map((r) => [r[0], ...statText(r.slice(1))]), columnStyles: numRight(1), didParseCell: rightHead });
  if (d.brands) doc.autoTable({ ...opts, startY: heading('Brand Comparison', next()), head: [['Brand', ...d.statHead]], body: d.brands.map((r) => [clean(r[0]), ...statText(r.slice(1))]), columnStyles: numRight(1), didParseCell: rightHead });
  doc.addPage();
  doc.autoTable({ ...opts, startY: heading(`Content List (${nf.format(d.contents.length)})`, 40),
    head: [['Brand', 'Platform', 'Title', 'Posted', 'Views', 'Likes', 'Comments', 'Shares', 'Saves', 'ER']],
    body: d.contents.map((r) => { const t = contentText(r); return [clean(t[0]), t[1], clean(String(r[2] || r[3]).slice(0, 70)), t[4], ...t.slice(5, 11)]; }),
    columnStyles: { 2: { cellWidth: 230 }, ...Object.fromEntries([4, 5, 6, 7, 8, 9].map((i) => [i, { halign: 'right' }])) } });
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(130); doc.text(`Xander Creative Agency  ·  Page ${i} of ${pages}`.replace('·', '-'), M, doc.internal.pageSize.getHeight() - 18); }
  doc.save(d.file + '.pdf');
}

function dialog(html, onSubmit) {

  $('#dialogs').append(d);

  const form = $('form', d);

}

    toast(`${rows.length} links added. Numbers fill in automatically within a few minutes.`);
  });
  const upd = () => {
    const r = parseLinks($('textarea', d).value, $('select', d).value);
    const per = Object.entries(PLAT).map(([k, l]) => [l, r.rows.filter((x) => x.platform === k).length]).filter((x) => x[1]).map(([l, n]) => `${n} ${l}`).join(', ');
    $('#linkInfo', d).textContent = `${r.rows.length} new links${per ? ` (${per})` : ''}` + (r.dup ? ` · ${r.dup} already added` : '') + (r.bad ? ` · ${r.bad} lines not recognized` : '');
  };

function parseLinks(text, brandId) {
  const have = new Set();
  for (const c of S.contents) if (c.brand_id === brandId) { have.add(c.platform + ':' + c.external_id); for (const a of c.aliases || []) have.add(c.platform + ':' + a); }
  const rows = []; let dup = 0, bad = 0;
  for (const line of String(text).split(/[\s,]+/).filter(Boolean)) {
    const p = XUrls.parseUrl(line);
    if (!p) { bad++; continue; }
    const k = p.platform + ':' + p.key;
    if (have.has(k)) { dup++; continue; }
    have.add(k); rows.push({ brand_id: brandId, platform: p.platform, external_id: p.key, url: p.url });
  }
  return { rows, dup, bad };
}

}

// ---------------------------------------------------------------- Connected Macrosheets
const sheetTitle = (sid) => S.settings.sheet_status?.[sid]?.title || `Macrosheets ${sid.slice(0, 6)}…`;
function sourcesDialog() {
  const urls = sheetUrls(S.settings.sheet), status = S.settings.sheet_status || {}, last = S.settings.sheet_last_sync;
  const brandsOf = (sid) => S.brands.filter((b) => b.sheet_state && sid in b.sheet_state).sort((a, z) => a.name.localeCompare(z.name, 'en'));
  const linksOf = (sid) => S.contents.filter((c) => c.sheet_refs && sid in c.sheet_refs).length;
  const cards = urls.map((u, i) => {
    const sid = sheetIdOf(u), st = status[sid] || {}, bs = brandsOf(sid), active = bs.filter((b) => !isArchived(b));
    const state = st.error ? `<span class="badge bad" title="${esc(st.error)}">Error ${ago(st.error_at)}</span>` : st.at ? `<span class="badge good">Connected</span>` : '<span class="badge warn">Waiting for first read</span>';
    return `<section class="src">
      <div class="src-head"><div><b>${esc(sheetTitle(sid))}</b> ${state}<div class="sub"><a href="${esc(u)}" target="_blank" rel="noopener">Open in Google Sheets ↗</a></div></div>
        <div class="src-stats"><span><b>${nf.format(bs.length)}</b> brands</span><span><b>${nf.format(active.length)}</b> active</span><span><b>${nf.format(linksOf(sid))}</b> links</span><span><b>${st.tabs ?? '–'}</b> tabs${st.hidden_tabs ? ` (${st.hidden_tabs} hidden)` : ''}</span></div></div>
      <div class="sub">Last read ${st.at ? ago(st.at) : '–'}${st.full_at ? ` · all tabs read ${ago(st.full_at)}` : ''}${st.error ? `<br><span style="color:var(--bad)">${esc(st.error)}</span>` : ''}</div>
      <div class="src-brands">${bs.map((b) => `<button class="chip" data-src-brand="${b.id}" ${isArchived(b) ? 'style="opacity:.6" title="Archived"' : ''}>${esc(b.name)}</button>`).join('') || '<span class="sub">No brands read yet.</span>'}</div>
    </section>`;
  }).join('');
  const d = dialog(`<h3>Connected Macrosheets</h3>
    <div class="hint">The macrosheets are the main source. Links, numbers, posting dates, the KPI block and hidden tabs are read automatically, one macrosheets after another
      (about 30 minutes for a full round). Links removed from a macrosheets disappear from the dashboard; a renamed tab keeps its brand.
      ${last?.at ? `<br>Latest read ${ago(last.at)}: macrosheets ${last.sheet ?? 1} of ${last.sheets ?? urls.length}, tabs ${esc((last.tabs || []).join(', '))}.` : ''}
      ${S.removedCount ? `<br>${nf.format(S.removedCount)} links are hidden because they were removed from the macrosheets.` : ''}</div>
    ${cards || '<div class="sub">No macrosheets connected yet. Add one under Data Sources &amp; Settings.</div>'}
    <div class="foot"><span><button class="btn" value="settings" formnovalidate>Add or remove macrosheets…</button></span><span><button class="btn primary" value="cancel" formnovalidate>Close</button></span></div>`,
  async (fd, action) => { if (action === 'settings') { setTimeout(settingsDialog, 0); return; } });
  d.querySelectorAll('[data-src-brand]').forEach((b) => b.addEventListener('click', (e) => { e.preventDefault(); d.close(); S.brandId = b.dataset.srcBrand; S.page = 0; render(); }));
}
async function settingsDialog() {
  const sh = S.settings.sheet || {}, ls = S.settings.sheet_last_sync, cs = S.settings.collector_status;
  const priv = LIVE ? await DB.privateStatus() : {};
  const team = LIVE ? await DB.getTeam() : [];
  const me = LIVE ? (await DB.sb.auth.getUser()).data.user?.email || '' : '';
  const line = (p) => (cs?.[p] ? `${PLAT[p]}: ${cs[p].ok} succeeded, ${cs[p].failed} failed, ${cs[p].unavailable} unavailable${cs[p].error ? ` — ${esc(cs[p].error)}` : ''}` : '');
  dialog(`<h3>Data Sources &amp; Settings</h3>
    <label>Macrosheets links — one per line (access: “Anyone with the link: Viewer”)<textarea name="url" style="min-height:70px" placeholder="https://docs.google.com/spreadsheets/d/…">${esc(sheetUrls(sh).join('\n'))}</textarea></label>
    <label>Tabs to skip (comma-separated)<input name="skip" value="${esc((sh.exclude_tabs || ['Credential Brand', 'List Reporting']).join(', '))}"></label>
    <div class="hint">Every other tab is treated as one brand; a brand with the same tab name in several macrosheets is merged. New links, numbers, hidden tabs (archive) and the KPI block reach the dashboard automatically, one macrosheets after another (about every 15–30 minutes per tab); “Save &amp; Sync Now” reads every macrosheets right away.<br>
      ${ls?.at ? `Last checked ${ago(ls.at)}${ls.last_added_at ? ` · last new link added ${ago(ls.last_added_at)}` : ''}.` : 'Not synced yet.'}${S.settings.sheet_sync_error ? `<br><span style="color:var(--bad)">Auto sync failed ${ago(S.settings.sheet_sync_error.at)}: ${esc(S.settings.sheet_sync_error.error)}</span>` : ''}</div>
    <label>YouTube API key ${priv.youtube_api_key ? '(saved — leave empty to keep it)' : '(not set — without it YouTube often fails and comments stay empty)'}<input name="yt" type="password" autocomplete="off" placeholder="${priv.youtube_api_key ? '••••••••' : 'AIza…'}"></label>
    <label>Instagram session / “sessionid” cookie ${priv.ig_sessionid ? '(saved)' : '(not set — without it Instagram cannot be fetched automatically)'}<input name="ig" type="password" autocomplete="off" placeholder="${priv.ig_sessionid ? '••••••••' : ''}"></label>
    <label>Team members allowed to open the dashboard (one email per line, no limit). After saving, create their sign-in under “Team Accounts…”.<textarea name="team" style="min-height:84px">${esc(team.join('\n'))}</textarea></label>
    <div class="hint"><b>Last data update:</b> ${cs?.at ? `${ago(cs.at)} — ${cs.queued} contents processed.<br>${['tiktok', 'instagram', 'youtube'].map(line).filter(Boolean).join('<br>')}` : 'no record yet.'}</div>
    <div class="hint" id="syncProgress" hidden style="white-space:pre-line;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text)"></div>
    <div class="foot"><span><button class="btn" value="sync">Save &amp; Sync Now</button> <button class="btn" value="accounts">Save &amp; Team Accounts…</button></span><span><button class="btn" value="cancel" formnovalidate>Cancel</button> <button class="btn primary" value="save">Save</button></span></div>`,
  async (fd, action) => {
    if (!LIVE) { toast('Preview mode: settings are not saved.'); return; }
    if (action === 'accounts') { await DB.setTeam(fd.get('team').split(/[\s,;]+/), me); setTimeout(teamDialog, 0); return; }
    const urls = [...new Set(fd.get('url').split(/\s+/).map((u) => u.trim()).filter((u) => sheetIdOf(u)))];
    await DB.setSetting('sheet', { urls, exclude_tabs: fd.get('skip').split(',').map((s) => s.trim()).filter(Boolean) });
    if (fd.get('yt').trim()) await DB.setPrivate('youtube_api_key', fd.get('yt'));
    if (fd.get('ig').trim()) await DB.setPrivate('ig_sessionid', fd.get('ig'));
    await DB.setTeam(fd.get('team').split(/[\s,;]+/), me);
    if (action === 'sync') {
      if (!urls.length) { toast('Enter at least one Google Sheets link first.'); return false; }
      const dlg = document.querySelector('dialog[open]');
      const box = dlg.querySelector('#syncProgress');
      dlg.querySelectorAll('button, input, textarea').forEach((x) => (x.disabled = true));
      box.hidden = false; box.textContent = 'Starting… this can take a minute or two.';
      let st;
      try {
        st = await syncSheet(false, (msg, t) => { box.textContent = `${msg}\n${t.added} new links · ${t.updated} updated · ${t.removed} removed so far`; });
      } finally { dlg.querySelectorAll('button, input, textarea').forEach((x) => (x.disabled = false)); box.hidden = true; }
      Object.assign(S, await DB.load());
      toast(`Sync complete: ${st.added} new links, ${st.brands} new brands, ${st.updated} updated, ${st.removed} removed${st.renamed.length ? `, renamed: ${st.renamed.join(', ')}` : ''}.`);
    } else toast('Settings saved.');
  });
}

// ---------------------------------------------------------------- akun anggota tim (tanpa email, tanpa batas)
const newPassword = () => { const a = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r = crypto.getRandomValues(new Uint32Array(12)); return [...r].map((x) => a[x % a.length]).join(''); };
async function teamDialog() {
  let list = [];
  try { list = LIVE ? (await DB.teamAdmin({ action: 'list' })).members : []; } catch (e) { toast('Could not load team accounts: ' + e.message); return; }
  const me = LIVE ? (await DB.sb.auth.getUser()).data.user?.email?.toLowerCase() : '';
  const status = (m) => !m.account ? '<span class="badge warn">No account yet</span>' : m.confirmed ? `<span class="badge good">Active</span> <span class="sub">${m.last_sign_in_at ? 'last sign-in ' + ago(m.last_sign_in_at) : 'never signed in'}</span>` : '<span class="badge warn">Not confirmed</span>';
  const d = dialog(`<h3>Team Accounts</h3>
    <div class="hint">Create a sign-in for any email on the team list — no email is sent and there is no limit. Share the password with the member privately (not in a group chat); they can change it after signing in. Add or remove emails under “Data Sources &amp; Settings”.</div>
    <div class="scroll"><table><thead><tr><th>Email</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.map((m) => `<tr><td>${esc(m.email)}${m.email === me ? ' <span class="sub">(you)</span>' : ''}</td><td>${status(m)}</td><td style="text-align:right"><button type="button" class="btn" data-acct="${esc(m.email)}">${m.account ? 'Set new password' : 'Create account'}</button></td></tr>`).join('') || '<tr><td colspan="3" class="sub">No team members yet.</td></tr>'}
    </tbody></table></div>
    <div id="acctForm" hidden style="border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px">
      <div><b id="acctEmail"></b></div>
      <label>Password (at least 8 characters)<input name="pw" autocomplete="new-password" minlength="8"></label>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" id="acctGen">New random password</button><button type="button" class="btn primary" id="acctSave">Save password</button></div>
    </div>
    <div class="foot"><span><button type="button" class="btn" id="myPw">Change my password</button></span><span><button class="btn primary" value="cancel" formnovalidate>Close</button></span></div>`, async () => {});
  const form = $('#acctForm', d), pw = $('input[name=pw]', d);
  let target = '';
  d.querySelectorAll('[data-acct]').forEach((b) => b.addEventListener('click', () => { target = b.dataset.acct; $('#acctEmail', d).textContent = target; pw.value = newPassword(); form.hidden = false; pw.focus(); pw.select(); }));
  $('#myPw', d).addEventListener('click', () => { target = me; $('#acctEmail', d).textContent = `${me} (you)`; pw.value = ''; form.hidden = false; pw.focus(); });
  $('#acctGen', d).addEventListener('click', () => { pw.value = newPassword(); pw.select(); });
  $('#acctSave', d).addEventListener('click', async () => {
    if (pw.value.length < 8) { toast('Password must be at least 8 characters.'); return; }
    try {
      let msg;
      if (target === me) { const { error } = await DB.sb.auth.updateUser({ password: pw.value }); if (error) throw error; msg = 'Your password has been changed.'; }
      else { const r = await DB.teamAdmin({ action: 'set_password', email: target, password: pw.value }); msg = r.created ? `Account created for ${target}. Share the password with them privately.` : `New password set for ${target}.`; }
      d.close(); await teamDialog(); toast(msg);
    } catch (e) { toast('Failed: ' + e.message); }
  });
}

// ---------------------------------------------------------------- boot
function loginScreen(msg = '', signup = false) {
  $('#root').innerHTML = `<div class="login"><form id="login"><div class="brandmark" style="padding:0"><b>XANDER CREATIVE</b><span>Content Performance</span></div>
    <label>Email<br><input name="email" type="email" required autocomplete="username" style="width:100%"></label>
    <label>Password${signup ? ' (at least 8 characters)' : ''}<br><input name="password" type="password" required minlength="${signup ? 8 : 1}" autocomplete="${signup ? 'new-password' : 'current-password'}" style="width:100%"></label>
    <button class="btn primary">${signup ? 'Create Account' : 'Sign In'}</button>
    <button type="button" class="btn ghost" id="swap">${signup ? 'Already have an account? Sign in' : 'No account yet? Create one'}</button>
    ${signup ? '' : '<div class="sub">No account yet? A team admin can also create one for you under “Team Accounts”.</div>'}
    <div class="sub" id="loginMsg">${esc(msg)}</div></form></div>`;
  $('#swap').addEventListener('click', () => loginScreen('', !signup));
  $('#login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target), cred = { email: fd.get('email').trim(), password: fd.get('password') };
    $('#loginMsg').textContent = 'Processing…';
    if (signup) {
      const { data, error } = await DB.sb.auth.signUp(cred);
      if (error) return loginScreen(/registered|exists/i.test(error.message) ? 'This email already has an account. Please sign in.'
        : /rate limit|not authorized|sending/i.test(error.message) ? 'The confirmation email could not be sent. Ask a team admin to create your account under “Team Accounts”, then sign in here.'
        : 'Could not create the account: ' + error.message, true);
      if (data.session) return start();
      return loginScreen('Account created. Open your email, click the confirmation link, then sign in here.');
    }
    const { error } = await DB.sb.auth.signInWithPassword(cred);
    if (error) loginScreen(/confirm/i.test(error.message) ? 'Email not confirmed yet. Click the link in the confirmation email first.' : 'Incorrect email or password.');
    else start();
  });
}
async function start() {
  $('#root').innerHTML = '<div class="empty">Loading data…</div>';
  try {
    if (LIVE && !(await DB.isMember())) {
      const email = (await DB.sb.auth.getUser()).data.user?.email;
      $('#root').innerHTML = `<div class="empty">Email <b>${esc(email)}</b> is not registered as a team member yet.<br>Ask an admin to add it under “Data Sources &amp; Settings”.<br><br><button class="btn" id="out">Sign Out</button></div>`;
      $('#out').onclick = async () => { await DB.sb.auth.signOut(); location.reload(); };
      return;
    }
    Object.assign(S, await DB.load()); render(); tvFromUrl();
  }
  catch (e) { $('#root').innerHTML = `<div class="empty">Could not load data: ${esc(e.message)}</div>`; }
}
(async () => {
  try {
    await DB.init();
    if (LIVE) { const { data } = await DB.sb.auth.getSession(); if (!data.session) return loginScreen(); }
    await start();
  } catch (e) { $('#root').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
})();
// Muat ulang data tiap 3 menit agar angka mengikuti pengambilan data di latar belakang.
setInterval(async () => {
  if (!LIVE || !DB.sb || !S.brandMap || document.querySelector('dialog[open], #login') || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
  try { Object.assign(S, await DB.load()); render(); } catch {}
}, 180000);
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (TV.on) render(); else if ($('#chart')) renderChart(filtered()); }, 150); });
</script>
